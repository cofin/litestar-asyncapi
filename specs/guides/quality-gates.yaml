metadata:
  version: "2.0"
  adaptive: true
  description: "Quality gates adapted for litestar-asyncapi"

implementation_gates:
  - name: local_tests_pass
    command: "make test"
    fallback: "uv run pytest src/tests"
    required: true
    adaptive: true
    description: "All tests must pass before proceeding"

  - name: linting_clean
    command: "make lint"
    fallback: "uv run ruff check src/"
    required: true
    description: "Zero linting errors allowed"

  - name: type_checking_pass
    command: "make type-check"
    fallback: "uv run mypy && uv run pyright"
    required: true
    adaptive: true
    description: "Type checking must pass (mypy + pyright)"

  - name: slots_check_pass
    command: "make slotscheck"
    fallback: "uv run slotscheck src/litestar_asyncapi/"
    required: true
    description: "Slots check must pass for all classes"

testing_gates:
  - name: coverage_threshold
    threshold: 90
    scope: "modified_modules"
    adaptive: true
    description: "Modified modules must achieve 90% coverage"

  - name: test_isolation
    required: true
    description: "Tests must work in parallel execution"

  - name: async_test_markers
    required: true
    description: "Async tests must use pytest.mark.anyio"

documentation_gates:
  - name: anti_pattern_scan
    adaptive: true
    rules:
      - pattern: "Optional\\["
        severity: "error"
        message: "Use T | None (PEP 604) instead of Optional[T]"

      - pattern: "from typing import Optional"
        severity: "error"
        message: "Do not import Optional, use T | None"

      - pattern: "class Test"
        severity: "warning"
        message: "Prefer function-based tests over class-based"

      - pattern: "from \\.\\."
        severity: "error"
        message: "Relative imports are banned, use absolute imports"

      - pattern: "from __future__ import annotations"
        severity: "error"
        message: "Do not use future annotations; use stringified annotations + TYPE_CHECKING imports"

  - name: required_patterns
    rules:
      - pattern: "__slots__"
        required_in: "plugin classes"
        message: "Plugin classes should define __slots__"

  - name: docstring_style
    style: "google"
    required: true
    description: "Google-style docstrings required"

  - name: pattern_documentation
    description: "New patterns must be captured in specs/guides/patterns/"
    required: true
