
####################
# Project Metadata #
####################
[project]
authors = [{ name = "Cody Fincher", email = "cody@litestar.dev" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Software Development",
  "Typing :: Typed",
  "Intended Audience :: Developers",
]
dependencies = [
  "litestar>=2.24.0,<3"
]
description = "AsyncAPI plugin for Litestar"
keywords = ["litestar", "asyncapi", "async", "api", "documentation"]
license = { text = "MIT" }
name = "litestar-asyncapi"
readme = "README.md"
requires-python = ">=3.10"
version = "0.4.1"

[project.urls]
Changelog = "https://github.com/litestar-org/litestar-asyncapi/releases/"
Discord = "https://discord.gg/litestar-919193495116337154"
Documentation = "https://github.com/litestar-org/litestar-asyncapi"
Homepage = "https://github.com/litestar-org/litestar-asyncapi"
Issue = "https://github.com/litestar-org/litestar-asyncapi/issues/"
Source = "https://github.com/litestar-org/litestar-asyncapi"

######################
# Build & Versioning #
######################
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/litestar_asyncapi"]
artifacts = ["src/litestar_asyncapi/assets/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/litestar_asyncapi/assets/**"]

[tool.hatch.metadata]
allow-direct-references = true

#####################
# Environment Setup #
#####################
[dependency-groups]
build = ["bump-my-version"]
dev = [
  { include-group = "build" },
  { include-group = "docs" },
  { include-group = "tests" },
  { include-group = "lint" },
]
docs = [
  "auto-pytabs[sphinx]>=0.5.0",
  "shibuya",
  "sphinx>=8.0.0",
  "sphinx-autobuild>=2021.3.14",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.5.0",
  "sphinx-paramlinks>=0.6.0",
  "sphinxcontrib-mermaid>=0.9.2",
]
lint = [
  "codespell",
  "mypy>=1.13.0",
  "prek",
  "pyright>=1.1.386",
  "ruff>=0.7.1",
  "slotscheck>=0.16.5",
]
tests = [
  "litestar[standard,attrs,pydantic]",
  "anyio",
  "coverage[toml]",
  "pytest",
  "pytest-timeout",
  "pytest-cov",
  "pytest-mock",
  "pytest-sugar",
  "pytest-xdist",
]

#####################
#    Testing        #
#####################
[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=litestar_asyncapi",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-fail-under=80",
]
filterwarnings = [
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore::DeprecationWarning:xdist.*",
  "ignore::DeprecationWarning:importlib._bootstrap",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
testpaths = ["src/tests"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self\\.debug",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  'class .*\bProtocol\):',
  '@(abc\.)?abstractmethod',
]

[tool.coverage.run]
patch = ["subprocess"]
branch = true
concurrency = ["multiprocessing"]
disable_warnings = ["no-data-collected", "module-not-measured", "module-not-imported"]
omit = ["src/tests/*"]
parallel = true
source = ["src/litestar_asyncapi"]

#####################
# Tools             #
#####################

[tool.bumpversion]
allow_dirty = true
commit = false
commit_args = "--no-verify"
current_version = "0.4.1"
ignore_missing_files = false
ignore_missing_version = false
message = "chore(release): bump to v{new_version}"
parse = """(?x)
    (?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)
    (-(?P<pre>alpha|beta|rc)\\.(?P<pre_n>\\d+))?
"""
regex = false
replace = "{new_version}"
search = "{current_version}"
serialize = [
  "{major}.{minor}.{patch}",
  "{major}.{minor}.{patch}-{pre}.{pre_n}",
]
sign_tags = false
tag = false
tag_message = "chore(release): v{new_version}"
tag_name = "v{new_version}"

[tool.bumpversion.parts.pre]
first_value = "stable"
optional_value = "stable"
values = ["alpha", "beta", "rc", "stable"]

[tool.bumpversion.parts.pre_n]
first_value = "1"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
replace = 'version = "{new_version}"'
search = 'version = "{current_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
replace = """
name = "litestar-asyncapi"
version = "{new_version}"
"""
search = """
name = "litestar-asyncapi"
version = "{current_version}"
"""

# Ruff configuration
[tool.ruff]
extend-exclude = ["docs/_build"]
line-length = 120
src = ["src"]
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
exclude = ["*.md"]
preview = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
  "A003",
  "A005",
  "B010",
  "COM812",
  "CPY001",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D202",
  "D205",
  "D415",
  "E501",
  "ISC001",
  "ANN401",
  "FBT",
  "PLR0912",
  "PLR0913",
  "PLW2901",
  "PT",
  "TD",
  "ARG001",
  "ARG002",
  "ARG003",
  "FIX",
  "PERF203",
  "PD011",
  "C901",
  "TC002",
  "RUF012",
]
select = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["litestar_asyncapi", "tests"]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"frontend/tests/*.py" = ["INP001"]
"frontend/tests/distribution.py" = ["S101", "T201"]
"src/litestar_asyncapi/_compat.py" = ["PLC0415", "SLF001", "S311"]
"docs/conf.py" = ["A001", "INP001"]
"docs/**/*.py" = ["A", "B", "D", "ERA", "S"]
"src/litestar_asyncapi/spec/enums.py" = ["S105"]
"src/litestar_asyncapi/config.py" = ["PLC0415"]
"src/litestar_asyncapi/plugins/*.py" = ["PLC0415"]
"src/litestar_asyncapi/asyncapi/utils/examples.py" = ["PLC0415", "PLR0911"]
"src/litestar_asyncapi/asyncapi/schema_generation/schema.py" = ["PLR0911", "PLR2004"]
"src/litestar_asyncapi/asyncapi/extractors/*.py" = ["PLC0415", "SLF001"]
"src/tests/**/*" = [
  "ANN",
  "ARG",
  "D",
  "FBT",
  "PLC0415",
  "PLR0913",
  "PLR2004",
  "PT",
  "S",
  "S101",
  "SLF001",
  "TID252",
]
"tools/**/*.py" = [
  "BLE001",
  "D",
  "DOC502",
  "PGH003",
  "PLC0415",
  "S310",
  "S404",
  "S603",
  "S607",
  "T201",
]

# Pyright configuration
[tool.pyright]
include = ["src/litestar_asyncapi"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

# Mypy configuration
[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
files = ["src/litestar_asyncapi"]
implicit_reexport = false
plugins = ["pydantic.mypy"]
show_error_codes = true
strict = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["pygments.*", "faker.*"]

[tool.slotscheck]
strict-imports = false
# The two UI adapters inherit Litestar's native, unslotted renderer base.
exclude-classes = "litestar_asyncapi\\.spec\\.bindings\\..*:.*Binding|litestar_asyncapi\\.plugins\\.renderers:(AsyncAPIUIRenderPlugin|AsyncAPIPlaygroundRenderPlugin)"

[tool.codespell]
ignore-words-list = ["asyncapi"]
skip = 'uv.lock,package-lock.json'
