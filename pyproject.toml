
####################
# Project Metadata #
####################
[project]
authors = [{ name = "Cody Fincher", email = "cody@litestar.dev" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python",
  "Topic :: Software Development",
  "Typing :: Typed",
  "Intended Audience :: Developers",
]
dependencies = [
  "litestar>=2.0.0"
]
description = "AsyncAPI plugin for Litestar"
keywords = ["litestar", "asyncapi", "async", "api", "documentation"]
license = { text = "MIT" }
name = "litestar-asyncapi"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Changelog = "https://github.com/litestar-org/litestar-asyncapi/releases/"
Discord = "https://discord.gg/litestar-919193495116337154"
Documentation = "https://github.com/litestar-org/litestar-asyncapi"
Homepage = "https://github.com/litestar-org/litestar-asyncapi"
Issue = "https://github.com/litestar-org/litestar-asyncapi/issues/"
Source = "https://github.com/litestar-org/litestar-asyncapi"

[project.entry-points."pygments.styles"]
litestar-asyncapi-dark = "tools.sphinx_ext.pygments_styles:LitestarAsyncApiDarkStyle"
litestar-asyncapi-light = "tools.sphinx_ext.pygments_styles:LitestarAsyncApiLightStyle"

######################
# Build & Versioning #
######################
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/litestar_asyncapi"]

[tool.hatch.metadata]
allow-direct-references = true

#####################
# Environment Setup #
#####################
[dependency-groups]
build = ["bump-my-version"]
dev = [
  { include-group = "build" },
  { include-group = "lint" },
  { include-group = "doc" },
  { include-group = "test" },
]
doc = [
  "auto-pytabs[sphinx]>=0.5.0",
  "sphinx>=8.0.0",
  "sphinx-autobuild>=2021.3.14",
  "sphinx-copybutton>=0.5.2",
  "sphinx-click>=6.0.0",
  "sphinx-design>=0.5.0",
  "sphinxcontrib-mermaid>=0.9.2",
  "sphinx-paramlinks>=0.6.0",
  "sphinx-togglebutton>=0.3.2",
  "sphinx-tabs",
  "sphinx-datatables",
  "sphinxcontrib-jquery",
  "numpydoc",
  "sphinx-iconify",
  "click-extra[sphinx]",
  "myst-parser",
  "sphinx-autodoc-typehints",
  "shibuya",
]
lint = [
  "mypy>=1.13.0",
  "pre-commit>=3.5.0",
  "pyright>=1.1.386",
  "ruff>=0.7.1",
  "slotscheck>=0.16.5",
]
test = [
  "litestar[standard,attrs,pydantic]",
  "anyio",
  "coverage[toml]",
  "pytest",
  "pytest-timeout",
  "pytest-cov",
  "pytest-mock",
  "pytest-sugar",
  "pytest-xdist",
]

#####################
#    Testing        #
#####################
[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=litestar_asyncapi",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-fail-under=80",
]
filterwarnings = [
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore::DeprecationWarning:xdist.*",
  "ignore::DeprecationWarning:importlib._bootstrap",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
testpaths = ["src/tests"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self\\.debug",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  'class .*\bProtocol\):',
  '@(abc\.)?abstractmethod',
]

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing"]
disable_warnings = ["no-data-collected", "module-not-measured", "module-not-imported"]
omit = ["src/tests/*"]
parallel = true
source = ["src/litestar_asyncapi"]

#####################
# Tools             #
#####################

[tool.bumpversion]
allow_dirty = true
commit = false
commit_args = "--no-verify"
current_version = "0.4.1"
ignore_missing_files = false
ignore_missing_version = false
message = "chore(release): bump to v{new_version}"
parse = """(?x)
    (?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)
    (-(?P<pre>alpha|beta|rc)\\.(?P<pre_n>\\d+))?
"""
regex = false
replace = "{new_version}"
search = "{current_version}"
serialize = [
  "{major}.{minor}.{patch}",
  "{major}.{minor}.{patch}-{pre}.{pre_n}",
]
sign_tags = false
tag = false
tag_message = "chore(release): v{new_version}"
tag_name = "v{new_version}"

[tool.bumpversion.parts.pre]
first_value = "stable"
optional_value = "stable"
values = ["alpha", "beta", "rc", "stable"]

[tool.bumpversion.parts.pre_n]
first_value = "1"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
replace = 'version = "{new_version}"'
search = 'version = "{current_version}"'

[[tool.bumpversion.files]]
filename = "src/litestar_asyncapi/__metadata__.py"
replace = '__version__ = "{new_version}"'
search = '__version__ = "{current_version}"'

# Ruff configuration
[tool.ruff]
line-length = 120
src = ["litestar_asyncapi", "tests", "examples", "docs", "docs/examples"]
target-version = "py310"

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
  "A003",    # flake8-builtins - class attribute {name} is shadowing a python builtin
  "A005",    # flake8-builtins - module {name} shadows a Python standard-library module
  "B010",    # flake8-bugbear - do not call setattr with a constant attribute value
  "D100",    # pydocstyle - missing docstring in public module
  "D101",    # pydocstyle - missing docstring in public class
  "D102",    # pydocstyle - missing docstring in public method
  "D103",    # pydocstyle - missing docstring in public function
  "D104",    # pydocstyle - missing docstring in public package
  "D105",    # pydocstyle - missing docstring in magic method
  "D106",    # pydocstyle - missing docstring in public nested class
  "D107",    # pydocstyle - missing docstring in __init__
  "D202",    # pydocstyle - no blank lines allowed after function docstring
  "D205",    # pydocstyle - 1 blank line required between summary line and description
  "D415",    # pydocstyle - first line should end with a period, question mark, or exclamation point
  "E501",    # pydocstyle line too long, handled by black
  "PLW2901", # pylint - for loop variable overwritten by assignment target
  "RUF012",  # Ruff-specific rule - annotated with classvar
  "ANN401",
  "FBT",
  "PLR0913", # too many arguments
  "PT",
  "TD",
  "ARG002",  # ignore for now; investigate
  "ARG003",  # ignore for now; investigate
  "PERF203", # ignore for now; investigate
  "PD011",   # pandas
  "PLR0912",
  "C901",
  "TC002",
]
select = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["litestar_asyncapi", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

# Mypy configuration
[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
implicit_reexport = false
plugins = ["pydantic.mypy"]
show_error_codes = true
strict = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["pygments.*", "docutils.*", "faker.*"]

[tool.slotscheck]
strict-imports = false

[tool.codespell]
ignore-words-list = ["asyncapi"]
skip = 'uv.lock'
