name: Test

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      coverage:
        required: false
        type: boolean
        default: false
      os:
        required: false
        type: string
        default: "ubuntu-latest"
      timeout:
        required: false
        type: number
        default: 60

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout }}
    env:
      PYTHON_VERSION: ${{ inputs.python-version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        run: make install PYTHON_VERSION="$PYTHON_VERSION"

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD/src" >> "$GITHUB_ENV"

      - name: Test
        if: ${{ !inputs.coverage }}
        run: make test

      - name: Test with coverage
        if: ${{ inputs.coverage }}
        run: uv run pytest src/tests --cov=litestar_asyncapi --cov-report=xml -n auto

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ inputs.coverage }}
        with:
          name: coverage-xml
          path: coverage.xml
