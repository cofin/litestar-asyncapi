name: Tested distribution

on:
  workflow_call:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: |
          uv sync --frozen --all-groups
          make js-install
          npx playwright install --with-deps chromium
      - name: Build and validate locked assets
        run: make build js-test validate-asyncapi browser-test
      - name: Test the installed wheel in Python
        run: make installed-test PYTHON_VERSION=3.12
      - name: Test the installed wheel in Chromium
        run: make browser-test-installed PYTHON_VERSION=3.12
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tested-distribution
          path: dist/*
          if-no-files-found: error
